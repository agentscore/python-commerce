[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentscore-commerce"
version = "1.0.0"
description = "Agent commerce SDK for Python — identity middleware (FastAPI, Flask, Django, AIOHTTP, Sanic, ASGI) + payment helpers + 402 builders + discovery + Stripe multichain. The full merchant-side toolkit for AgentScore-powered agent commerce."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["agentscore", "agent-commerce", "agentic-payments", "402", "x402", "mpp", "machine-payments-protocol", "fastapi", "starlette", "flask", "django", "aiohttp", "sanic", "middleware", "trust", "reputation", "kyc", "identity", "stripe", "tempo", "solana", "base", "ai-agent"]
dependencies = [
    "httpx>=0.25.0,<1.0.0",
    "agentscore-py>=1.9.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Framework :: Django",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
starlette = ["starlette>=0.27.0"]
fastapi = ["fastapi>=0.100.0"]
flask = ["flask>=2.0.0"]
django = ["django>=4.0"]
aiohttp = ["aiohttp>=3.8.0"]
sanic = ["sanic>=23.0.0"]
stripe = ["stripe>=11.0.0"]
# Payment-protocol peer deps for create_x402_server / create_mppx_server.
# Installed only by merchants who accept the corresponding rail.
# Note: the Coinbase x402 facilitator is reached through the main `x402`
# package (HTTPFacilitatorClient pointed at the Coinbase URL), not a separate
# package — no `coinbase-x402` extra needed.
x402 = ["x402[evm,svm,fastapi]>=2.8,<3"]
mppx = ["pympp[server,tempo,stripe]>=0.6,<1"]

[project.urls]
Homepage = "https://agentscore.sh"
Repository = "https://github.com/agentscore/python-commerce"
Issues = "https://github.com/agentscore/python-commerce/issues"

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "ty>=0.0.32",
    "vulture>=2.15",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "anyio[trio]>=4.0",
    "starlette>=0.27.0",
    "fastapi>=0.100.0",
    "flask>=2.0.0",
    "django>=4.0",
    "aiohttp>=3.8.0",
    "sanic>=23.0.0",
    "sanic-testing>=24.0.0",
    "pytest-cov>=6.0",
    "python-dotenv>=1.2.2",
    "stripe>=11.0.0",
]

[tool.uv.sources]
# Local-first dev: use the linked python-sdk repo for agentscore-py until 1.9.0 publishes (Phase 0 cascade).
# Switch to PyPI by removing this stanza after publish.
agentscore-py = { path = "../python-sdk", editable = true }

[tool.ty.src]
include = ["agentscore_commerce"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=agentscore_commerce --cov-report=term-missing --cov-fail-under=95"
