[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentscore-commerce"
version = "2.5.17"
description = "Agentic commerce SDK for Python: identity middleware (FastAPI, Flask, Django, AIOHTTP, Sanic, ASGI) + payment helpers + 402 builders + discovery + Stripe multichain. The full merchant-side toolkit for AgentScore-powered agentic commerce."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["agentscore", "agent-commerce", "agentic-payments", "402", "x402", "mpp", "machine-payments-protocol", "fastapi", "starlette", "flask", "django", "aiohttp", "sanic", "middleware", "trust", "reputation", "kyc", "identity", "stripe", "tempo", "solana", "base", "ai-agent"]
dependencies = [
    "httpx>=0.25.0,<1.0.0",
    "agentscore-py>=2.6.2",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Framework :: Django",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
starlette = ["starlette>=0.27.0"]
fastapi = ["fastapi>=0.100.0"]
flask = ["flask>=2.0.0"]
django = ["django>=4.0"]
aiohttp = ["aiohttp>=3.8.0"]
sanic = ["sanic>=23.0.0"]
stripe = ["stripe>=11.0.0"]
# Payment-protocol peer deps for create_x402_server / create_mppx_server.
# Installed only by merchants who accept the corresponding rail.
# Note: there is no Python `coinbase-x402` package. The Coinbase facilitator is
# reached through the main `x402` package's HTTPFacilitatorClient pointed at
# https://api.cdp.coinbase.com/platform/v2/x402 with a CDP-JWT auth provider;
# `cdp-sdk` is the JWT minter. Install via the `coinbase` extra when needed.
x402 = ["x402[evm,fastapi]>=2.9,<3"]
mppx = ["pympp[server,tempo,stripe]>=0.6,<1"]
coinbase = ["cdp-sdk>=1.0,<2"]
ucp = ["joserfc>=1.0.0,<2"]
redis = ["redis>=5.0,<9"]

[project.urls]
Homepage = "https://www.agentscore.com"
Repository = "https://github.com/agentscore/python-commerce"
Issues = "https://github.com/agentscore/python-commerce/issues"

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "ty>=0.0.32",
    "vulture>=2.15",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "anyio[trio]>=4.0",
    "starlette>=0.27.0",
    "fastapi>=0.100.0",
    "flask>=2.0.0",
    "django>=4.0",
    "aiohttp>=3.8.0",
    "sanic>=23.0.0",
    "sanic-testing>=24.0.0",
    "pytest-cov>=6.0",
    "python-dotenv>=1.2.2",
    "stripe>=11.0.0",
    "lefthook>=2.1.6",
    "cdp-sdk>=1.0,<2",
    "joserfc>=1.0.0,<2",
    "redis>=5.0,<9",
]

[tool.ty.src]
include = ["agentscore_commerce"]

[tool.vulture]
# Live symbols vulture sees as unused. ASGI signatures, Protocol method params,
# public re-exports, TYPE_CHECKING-only imports referenced via string casts.
# Replaces a top-level vulture_whitelist.py file (which CodeQuality flagged
# as "statement has no effect" — accurate observation, but vulture's whitelist
# semantics require bare identifiers, which static analyzers can't distinguish
# from real no-op statements).
ignore_names = [
    "scope", "receive", "send",  # ASGI middleware __call__ signature
    "ex", "seconds",  # _RedisLike Protocol method params
    "default",  # HeadersLike.get Protocol stub param (mirrors Mapping.get)
    "AgentScoreGate", "AssessResult", "DenialReason", "OperatorVerification",
    "DecisionPolicy", "Signer",  # TYPE_CHECKING string-cast references
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=agentscore_commerce --cov-report=term-missing --cov-fail-under=95"
# joserfc emits SecurityWarning for EdDSA on every sign/verify (see RFC 9864).
# UCP §6 explicitly accepts EdDSA so we suppress. SDK helpers wrap their own
# joserfc calls with a context-manager filter, but tests that hand-construct
# joserfc calls directly need the suppression too. Scope matches the exact
# message + class so a future unrelated EdDSA warning still surfaces.
filterwarnings = [
    "ignore:^EdDSA is deprecated via RFC 9864$:joserfc.errors.SecurityWarning",
]

[tool.uv]
required-version = ">=0.11.0"
# fastapi 0.136.3 is a malicious release (MAL-2026-4750): it injects an
# undocumented `fastar` typosquat dependency. Pin away from it until a clean
# release supersedes it on PyPI.
constraint-dependencies = ["fastapi!=0.136.3"]
